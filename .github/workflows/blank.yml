# This is a basic workflow to help you get started with Actions
permissions:
  pull-requests: write
name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
      - name: Comment Pull Request
        uses: thollander/actions-comment-pull-request@v3.0.1
        with:
          # Message that should be printed in the pull request
          message: # optional
          # Path of the file that should be commented
          file-path: # optional
          # Github token of the repository (automatically created by Github)
          github-token: ${{ secrets.GITHUB_TOKEN }}
            echo Bonjour ${{ vars.PRENOM }} ${{ secrets.NOM }} 
          # You can set some reactions on your comments through the `reactions` input.
          reactions: # optional
          # Manual pull request number
          pr-number: # optional
          # A tag on your comment that will be used to identify a comment in case of replacement.
          comment-tag: # optional
          # Mode that will be used (upsert/recreate/delete/delete-on-completion)
          mode: # optional, default is upsert
          # Whether a comment should be created even if comment-tag is not found.
          create-if-not-exists: # optional, default is true
                
